  <!-- ===== Main Content ===== -->
  <main class="page-wrapper">

    <!-- Left: Hero text -->
    <section class="hero">
      <h1>Jump right in</h1>
      <p>Sign in to continue</p>
      <p class="new-user">New user? <a href="./register/signup.html">Create account</a></p>
    </section>

    <!-- Right: Login Card -->
    <div class="card">

      <!-- Social Buttons -->
      <div class="social-btns">

        <!-- Sign in with Google -->
        <a href="#" class="btn-social">
          <span class="icon">
            <!-- Google SVG (download__3_.svg) -->
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="21" fill="none" viewBox="0 0 24 25">
              <path fill="#4280EF" d="M20.4 13.5c0-.56-.055-1.14-.146-1.682h-7.893v3.201h4.52a3.77 3.77 0 0 1-1.676 2.514l2.698 2.08c1.585-1.465 2.497-3.6 2.497-6.113"/>
              <path fill="#34A353" d="M12.362 21.601c2.26 0 4.156-.741 5.541-2.007l-2.697-2.062c-.748.507-1.714.796-2.844.796-2.187 0-4.028-1.465-4.703-3.418l-2.77 2.116a8.37 8.37 0 0 0 7.473 4.575"/>

              <path fill="#E54335" d="M12.362 8.292a4.59 4.59 0 0 1 3.208 1.247l2.388-2.387A8.1 8.1 0 0 0 12.362 5 8.37 8.37 0 0 0 4.89 9.575l2.77 2.134c.675-1.97 2.516-3.417 4.703-3.417"/>

          </span>
          Sign in with Google
        </a>

        <!-- Sign in with Apple -->
        <a href="#" class="btn-social">
          <span class="icon">
            <!-- Apple SVG (download.svg) -->
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="18" fill="none" viewBox="0 0 15 18">
              <path fill="#1a1a1a" fill-rule="evenodd" d="M10.78 4.215c.575.016 2.213.221 3.269 1.724-.085.05-1.951 1.121-1.93 3.32.023 2.629 2.35 3.503 2.39 3.517-.014.062-.366 1.259-1.243 2.473-.733 1.07-1.5 2.115-2.72 2.134-1.184.026-1.582-.68-2.94-.68-1.371 0-1.795.662-2.931.707-1.161.042-2.049-1.142-2.808-2.202C.35 13.044-.832 9.11.752 6.433 1.52 5.12 2.92 4.274 4.415 4.252c1.162-.023 2.24.765 2.955.766.7 0 2.035-.944 3.41-.803M10.794 0c.116 1.03-.302 2.045-.913 2.791-.638.734-1.657 1.296-2.65 1.224-.13-.991.373-2.045.936-2.688C8.804.597 9.91.038 10.794 0" clip-rule="evenodd"/>
            </svg>
          </span>
          Sign in with Apple
        </a>

      </div>

      <!-- Divider -->
      <div class="divider">or</div>

      <!-- Email Input -->
      <div class="input-group">
        <input type="email" placeholder="Email Address" autocomplete="email" />
      </div>

      <!-- Password Input -->
      <div class="input-group">
        <input type="password" placeholder="Password" autocomplete="current-password" id="passwordInput" />
        <button class="eye-btn" type="button" aria-label="Toggle password visibility">
          <!-- Eye SVG (download__4_.svg) -->
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">

          </svg>
        </button>
      </div>

      <!-- Forgot Password -->
      <a href="#" class="forgot-password">Forgot password?</a>

      <!-- Sign In Button -->
      <button class="btn-signin" type="button">Sign in</button>

      <!-- Card Footer -->
      <div class="card-footer">
        <span>Trouble signing in? <a href="#" class="chat-link">Chat with us</a></span>
        <span class="legal-links">
          <a href="/privacy">Privacy</a>
          <span class="sep">|</span>
          <a href="/terms">Terms</a>
        </span>
      </div>

    </div>
    <!-- /card -->

  </main>

  <!-- ===== Floating Chat Button ===== -->
  <button class="chat-fab" type="button" aria-label="Open chat">
    <!-- Chat bubble icon -->
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

    </svg>
  </button>
